name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel a superseded run on the same ref, so pushes to an open PR do not
# queue up stale runs behind the latest one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Typecheck (src + scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      # Checks src (tsconfig.json) and scripts (scripts/tsconfig.json,
      # which the root tsconfig excludes) — see the "typecheck" script.
      - run: npm run typecheck

  test:
    name: Unit tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - run: npm test

  build:
    name: Next build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - run: npm run build
        env:
          # Harmless placeholders, not real secrets. CI has no .env.local
          # and no real Supabase project. src/lib/data/adapter-anon.ts
          # throws when these are unset (by design — no silent mock
          # fallback), so the build needs values present. Confirmed
          # locally: `npm run build` succeeds with these placeholders set.
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci-placeholder-anon-key"
          NEXT_PUBLIC_SITE_URL: "https://ballotmatch.org"
